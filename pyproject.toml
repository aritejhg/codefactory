[project]
name = "codefactory"
version = "0.1.0"
description = "A small local task workflow controller"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.29,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codefactory"]
